
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#070b14"/>
  <text x="28%" y="65%" font-size="270" font-family="Arial, sans-serif" font-weight="bold"
        fill="#2880ff" filter="url(#glowBlue)">J</text>
  <text x="50%" y="65%" font-size="270" font-family="Arial, sans-serif" font-weight="bold"
        fill="#ff0082" filter="url(#glowPink)">M</text>
</svg>
